<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@1,400;1,500&display=swap" rel="stylesheet"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:16.5px/1.55 var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;border:1px solid transparent;font:700 15px/1.1 var(--font-sans);letter-spacing:.02em;cursor:pointer}
