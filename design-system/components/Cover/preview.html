<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Fraunces:ital,wght@1,500&display=swap" rel="stylesheet">
<style>body{margin:0;background:var(--bg)}svg{display:block;width:960px;height:300px}.nm{font:500 96px/1 var(--font-sans);fill:var(--text);letter-spacing:-2px}.tg{font:400 14px var(--font-sans);fill:var(--muted)}.navy{fill:var(--primary)}.cr{fill:var(--cream);stroke:var(--line-2);stroke-width:1}.yl{fill:var(--yellow)}.ac{fill:var(--accent)}.lv{fill:var(--lav-strong)}.ln{stroke:var(--line-2);stroke-width:1;fill:none}</style>
<svg viewBox="0 0 960 300">
<!-- blocks: primary 240x180 (space-x, radius-lg), cream 144x144, yellow 96x96, accent 96x96 satellite, lav-strong 48

pattern: pills and discs from radius-btn: the store's chip/vial language is all pills
steps: 24/48/96px; radii 20px and 999px -->
<rect class="navy" x="640" y="0" width="240" height="180" rx="20"/>
<rect class="cr" x="480" y="96" width="144" height="144" rx="20"/>
<rect class="yl" x="640" y="196" width="96" height="96" rx="48"/>
<rect class="ac" x="752" y="196" width="128" height="48" rx="24"/>
<rect class="lv" x="496" y="24" width="120" height="48" rx="24"/>
<circle class="yl" cx="904" cy="48" r="24"/>
<circle class="lv" cx="904" cy="120" r="24"/>
<text class="nm" x="40" y="226">Pepsoma</text>
<text class="tg" x="42" y="272">Research-grade peptides, tested lot by lot.</text>
