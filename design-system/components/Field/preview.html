<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@1,400;1,500&display=swap" rel="stylesheet"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:16.5px/1.55 var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;border:1px solid transparent;font:700 15px/1.1 var(--font-sans);letter-spacing:.02em;cursor:pointer}
.f{display:grid;gap:6px;max-width:340px;margin-bottom:14px}label{font:600 13px var(--font-sans)}.i{padding:13px 14px;min-height:48px;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font:inherit}.foc{border-color:var(--focus);box-shadow:0 0 0 3px rgba(90,115,216,.22)}.bad{border-color:var(--danger)}.e{color:var(--danger);font-size:12.5px}</style>
<div class="row" style="align-items:flex-start;gap:24px"><div><div class="f"><label>Email</label><input class="i foc" value="lab@example.com"></div></div><div><div class="f"><label>Card number</label><input class="i bad" value="4242 4242"><span class="e">Enter a valid card number.</span></div></div></div>
