<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,wght@1,400;1,500&display=swap" rel="stylesheet"><style>body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:16.5px/1.55 var(--font-sans)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:999px;border:1px solid transparent;font:700 15px/1.1 var(--font-sans);letter-spacing:.02em;cursor:pointer}
.p{background:var(--primary);color:var(--primary-text)}.s{background:var(--secondary);color:var(--secondary-text)}.g{background:transparent;border-color:var(--line-2);color:var(--text)}.y{background:var(--yellow);color:var(--on-yellow);font-weight:500;font-size:17px}.sm{padding:8px 14px;font-size:13px}</style>
<div class="row"><button class="btn p">Add to cart</button><button class="btn s">View details</button><button class="btn g">Cancel</button><button class="btn y">Shop&nbsp;<i style="font-family:var(--font-serif);font-weight:500">peptides</i></button></div>
