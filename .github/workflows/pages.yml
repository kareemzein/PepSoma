name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # One site, two links: the store at the main address, the feedback page at /pepsoma-feedback/.
      # Only these two folders are published (session notes and the README stay in the repo).
      - name: Assemble site
        run: |
          mkdir _site
          cp -R store/. _site/
          cp -R pepsoma-feedback _site/pepsoma-feedback
          touch _site/.nojekyll
          # links from before the reorganization forward to where those pages live now
          forward() {
            mkdir -p "_site/$1"
            printf '<!doctype html><meta charset="utf-8"><title>Pepsoma</title><script>location.replace("%s" + location.search + location.hash)</script><meta http-equiv="refresh" content="0; url=%s"><a href="%s">Continue</a>\n' "$2" "$2" "$2" > "_site/$1/index.html"
          }
          forward a ../
          forward b ../pepsoma-feedback/designs/b/
          forward v1 ../pepsoma-feedback/first-draft/
          # the store with comment mode on (see store/js/review.js)
          forward review "../?review"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
