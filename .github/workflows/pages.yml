name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Supabase URL + anon key from the repo's Actions secrets; with none set the store runs as the browser-only demo
      - name: Write store/js/env.js
        run: node tools/env.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # One site, two links: the store at the main address, the feedback page at /pepsoma-feedback/.
      # Only these two folders are published (session notes and the README stay in the repo).
      - name: Assemble site
        run: |
          mkdir _site
          cp -R store/. _site/
          # cache busting: Pages lets browsers reuse files for 10 minutes, so stamp this deploy's commit
          # on the store's CSS/JS links; a reload then always fetches the new files instead of mixing old and new
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+|styles\.css|app\.js)\"#\1=\"\2?v=$v\"#g" _site/index.html
          cp -R pepsoma-feedback _site/pepsoma-feedback
          # frozen earlier versions of the store, with a switcher page at /versions/
          cp -R versions _site/versions
          # same stamp on each frozen version's page, so its review tools update too
          for f in _site/versions/*/index.html; do sed -i -E "s#(href|src)=\"((css|js)/[^\"?]+|styles\.css|app\.js)\"#\1=\"\2?v=$v\"#g" "$f"; done
          touch _site/.nojekyll
          # links from before the reorganization forward to where those pages live now
          forward() {
            mkdir -p "_site/$1"
            printf '<!doctype html><meta charset="utf-8"><title>Pepsoma</title><script>location.replace("%s" + location.search + location.hash)</script><meta http-equiv="refresh" content="0; url=%s"><a href="%s">Continue</a>\n' "$2" "$2" "$2" > "_site/$1/index.html"
          }
          forward a ../
          forward b ../pepsoma-feedback/designs/b/
          forward v1 ../pepsoma-feedback/first-draft/
          # V1 and V2 with comment mode on (see store/js/review.js); V3 review is the store with ?review
          forward review "../versions/v1/?review"
          forward review-v2 "../versions/v2/?review"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
